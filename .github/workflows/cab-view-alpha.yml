name: Cab view - Alpha release

# Builds the cab view alpha for players: MacOS (universal, Apple Silicon and
# Intel), Windows (x64) and Linux (generic x64). Every package already has
# OpenGFX, OpenSFX and OpenMSX inside, so it runs without downloading
# anything else.
#
# Pushing a tag like "15.3-cabview-alpha1" builds everything and puts it on a
# DRAFT release for that tag. Nothing is published: the draft is only visible
# to the owner of the repository until he publishes it by hand.
#
# Pull requests touching this file only build, to check the packages.
# The packages are not signed by a developer certificate (MacOS: ad-hoc only).

on:
  push:
    tags:
    - '*-cabview-alpha*'
  pull_request:
    paths:
    - '.github/workflows/cab-view-alpha.yml'
    - 'cab_view_dev/alpha/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version name shown in the game. For a tag it is the tag itself.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '15.3-cabview-alpha-test' }}
  OPENGFX_VERSION: '8.0'
  OPENSFX_VERSION: '1.0.3'
  OPENMSX_VERSION: '0.4.2'

jobs:
  basesets:
    name: Base sets

    runs-on: ubuntu-latest

    steps:
    # Kept in the cache, so the build does not depend on the CDN answering every time.
    - name: Cache base sets
      id: cache
      uses: actions/cache@v4
      with:
        path: basesets
        key: basesets-v2-gfx${{ env.OPENGFX_VERSION }}-sfx${{ env.OPENSFX_VERSION }}-msx${{ env.OPENMSX_VERSION }}

    - name: Download base sets
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p download basesets
        for SET in opengfx-${OPENGFX_VERSION} opensfx-${OPENSFX_VERSION} openmsx-${OPENMSX_VERSION}; do
          NAME=${SET%%-*}
          VER=${SET#*-}
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors --speed-limit 10000 --speed-time 30 \
            https://cdn.openttd.org/${NAME}-releases/${VER}/${SET}-all.zip -o download/${SET}.zip
          unzip -o download/${SET}.zip -d basesets
        done
        # The game reads graphics and sounds from a tar, but music only from
        # plain files (the music drivers need the MIDI files on disk).
        tar -xf basesets/openmsx-${OPENMSX_VERSION}.tar -C basesets
        rm basesets/openmsx-${OPENMSX_VERSION}.tar
        ls -l basesets

    - name: Store base sets
      uses: actions/upload-artifact@v5
      with:
        name: internal-basesets
        path: basesets
        retention-days: 1

  linux:
    name: Linux (generic x64)
    needs: basesets

    runs-on: ubuntu-latest
    container:
      # As the official release: AlmaLinux 8 (glibc 2.28), so the binary runs
      # on most distributions.
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set version
      run: |
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        git tag -f "${VERSION}"

    - name: Install dependencies
      run: |
        echo "::group::Install system dependencies"
        # perl-IPC-Cmd, wget, and zip are needed to run vcpkg.
        # autoconf-archive is needed to build ICU.
        # perl-Time-Piece is needed to build OpenSSL (as upstream since 15.3).
        yum install -y \
          autoconf-archive \
          perl-IPC-Cmd \
          perl-Time-Piece \
          wget \
          zip \
          # EOF
        cp /usr/share/aclocal/* /usr/local/share/aclocal/
        echo "::endgroup::"

        # See release-linux.yml: fluidsynth with as few dependencies as possible.
        echo "::group::Install fluidsynth"
        wget https://github.com/FluidSynth/fluidsynth/archive/v2.4.4.tar.gz
        tar xf v2.4.4.tar.gz
        (
          cd fluidsynth-2.4.4
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build . -j $(nproc)
          cmake --install .
        )
        echo "::endgroup::"

        echo "::group::Install audio drivers"
        yum install -y \
          alsa-lib-devel \
          pulseaudio-libs-devel \
          # EOF
        echo "::endgroup::"

        echo "::group::Install video drivers"
        yum install -y \
          libX11-devel \
          libXcursor-devel \
          libXext-devel \
          libXfixes-devel \
          libXi-devel \
          libxkbcommon-devel \
          libXrandr-devel \
          libXScrnSaver-devel \
          mesa-libEGL-devel \
          mesa-libGL-devel \
          mesa-libGLES-devel \
          wayland-devel \
          wayland-protocols-devel \
          # EOF
        echo "::endgroup::"

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6
      with:
        vcpkg-location: /vcpkg
        mono-install-command: 'yum install -y mono-complete'

    - name: Install GCC problem matcher
      uses: ammaraskar/gcc-problem-matcher@master

    - name: Build
      run: |
        mkdir -p build
        cd build

        echo "::group::CMake"
        cmake ${GITHUB_WORKSPACE} \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.vcpkg.outputs.vcpkg-cmake }} \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DOPTION_USE_ASSERTS=OFF \
          -DOPTION_PACKAGE_DEPENDENCIES=ON \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . -j $(nproc) --target openttd
        echo "::endgroup::"

    - name: Get base sets
      uses: actions/download-artifact@v6
      with:
        name: internal-basesets
        path: build/baseset

    - name: Create bundle
      run: |
        cd build
        cpack
        rm -f bundles/*.sha256
        ls -l bundles

    - name: Store bundle
      uses: actions/upload-artifact@v5
      with:
        name: openttd-cabview-alpha-linux
        path: build/bundles
        retention-days: 14

  macos:
    name: MacOS (universal)
    needs: basesets

    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.13

    steps:
    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Checkout
      uses: actions/checkout@v6

    - name: Set version
      run: |
        git tag -f "${VERSION}"

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Install GCC problem matcher
      uses: ammaraskar/gcc-problem-matcher@master

    # The x64 build runs on an arm64 machine, so it needs the tools built for the machine itself.
    - name: Build tools
      run: |
        mkdir build-host
        cd build-host
        cmake ${GITHUB_WORKSPACE} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOPTION_TOOLS_ONLY=ON
        cmake --build . -j $(sysctl -n hw.logicalcpu) --target tools

    - name: Build arm64
      run: |
        mkdir build-arm64
        cd build-arm64

        echo "::group::CMake"
        cmake ${GITHUB_WORKSPACE} \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DVCPKG_TARGET_TRIPLET=arm64-osx \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.vcpkg.outputs.vcpkg-cmake }} \
          -DHOST_BINARY_DIR=${GITHUB_WORKSPACE}/build-host \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DOPTION_USE_ASSERTS=OFF \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . -j $(sysctl -n hw.logicalcpu) --target openttd
        echo "::endgroup::"

    - name: Build x64
      run: |
        mkdir build-x64
        cd build-x64

        echo "::group::CMake"
        cmake ${GITHUB_WORKSPACE} \
          -DCMAKE_OSX_ARCHITECTURES=x86_64 \
          -DVCPKG_TARGET_TRIPLET=x64-osx \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.vcpkg.outputs.vcpkg-cmake }} \
          -DHOST_BINARY_DIR=${GITHUB_WORKSPACE}/build-host \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DOPTION_USE_ASSERTS=OFF \
          -DAPPLE_UNIVERSAL_PACKAGE=1 \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . -j $(sysctl -n hw.logicalcpu) --target openttd
        echo "::endgroup::"

    - name: Get base sets
      uses: actions/download-artifact@v6
      with:
        name: internal-basesets
        path: build-x64/baseset

    - name: Create app
      run: |
        cd build-x64

        echo "::group::Create universal binary"
        lipo -create -output openttd-universal ../build-*/openttd
        mv openttd-universal openttd
        lipo -info openttd
        echo "::endgroup::"

        echo "::group::Run CPack"
        cpack
        echo "::endgroup::"

        APP=$(echo _CPack_Packages/*/Bundle/openttd-*/OpenTTD.app)
        ls "${APP}/Contents/Resources/baseset"

        echo "::group::Sign ad-hoc and zip"
        codesign --force --deep --sign - "${APP}"
        codesign --verify --deep --strict "${APP}"
        mkdir app
        ditto -c -k --keepParent "${APP}" app/openttd-${VERSION}-macos-universal.zip
        echo "::endgroup::"

    - name: Store app
      uses: actions/upload-artifact@v5
      with:
        name: openttd-cabview-alpha-macos
        path: build-x64/app
        retention-days: 14

  windows:
    name: Windows (x64)
    needs: basesets

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set version
      shell: bash
      run: |
        git tag -f "${VERSION}"

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Install MSVC problem matcher
      uses: ammaraskar/msvc-problem-matcher@master

    - name: Configure developer command prompt for x64
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build
      shell: bash
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        cmake ${GITHUB_WORKSPACE} \
          -GNinja \
          -DVCPKG_TARGET_TRIPLET=x64-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}" \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DOPTION_USE_ASSERTS=OFF \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . --target openttd
        echo "::endgroup::"

    - name: Get base sets
      uses: actions/download-artifact@v6
      with:
        name: internal-basesets
        path: build/baseset

    - name: Create bundle
      shell: bash
      run: |
        cd build
        cpack
        rm -f bundles/*.sha256
        ls -l bundles

    - name: Store bundle
      uses: actions/upload-artifact@v5
      with:
        name: openttd-cabview-alpha-windows
        path: build/bundles
        retention-days: 14

  release:
    name: Draft release
    needs:
    - linux
    - macos
    - windows

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Get bundles
      uses: actions/download-artifact@v6
      with:
        pattern: openttd-cabview-alpha-*
        path: bundles
        merge-multiple: true

    # Plain names, so the release notes can link straight to them. This also
    # runs for pull requests, to check the notes and names before a release.
    - name: Prepare release files
      run: |
        cd bundles
        ls -l
        mv *-macos-*.zip "openttd-${VERSION}-macos.zip"
        mv *-windows-*.zip "openttd-${VERSION}-windows-64bit.zip"
        mv *-linux-*.tar.xz "openttd-${VERSION}-linux-64bit.tar.xz"
        sha256sum * > ../SHA256SUMS.txt
        mv ../SHA256SUMS.txt .
        cat SHA256SUMS.txt

        sed -e "s|{VERSION}|${VERSION}|g" -e "s|{REPO}|${GITHUB_REPOSITORY}|g" \
          ../cab_view_dev/alpha/release_notes.md > ../release_notes.md
        # Every file the notes link to must be there.
        for FILE in $(grep -o "releases/download/${VERSION}/[^)]*" ../release_notes.md | sed 's|.*/||' | sort -u); do
          test -f "${FILE}" || { echo "Release notes link to a missing file: ${FILE}"; exit 1; }
        done

    - name: Create draft release
      # Only for a pushed tag; pull requests only check the build.
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # A draft is not public; publishing it is done by hand on GitHub.
        gh release create "${VERSION}" bundles/* \
          --repo "${GITHUB_REPOSITORY}" \
          --draft \
          --prerelease \
          --verify-tag \
          --title "OpenTTD cab view ${VERSION#*-cabview-}: first person view (${VERSION})" \
          --notes-file release_notes.md
