name: Cab view - MacOS app

# Builds a ready to run OpenTTD.app (arm64, with OpenGFX inside) for trying
# out the cab view on a Mac without a build environment. It is not signed by
# a developer certificate, only ad-hoc.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: MacOS app (arm64)

    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.13

    steps:
    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Build
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        cmake .. \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DVCPKG_TARGET_TRIPLET=arm64-osx \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.vcpkg.outputs.vcpkg-cmake }} \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DOPTION_USE_ASSERTS=OFF \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . -j $(sysctl -n hw.logicalcpu) --target openttd
        echo "::endgroup::"

    - name: Create app
      run: |
        cd build

        echo "::group::Run CPack"
        cpack
        echo "::endgroup::"

        APP=$(echo _CPack_Packages/*/Bundle/openttd-*/OpenTTD.app)

        echo "::group::Add OpenGFX"
        curl -fL https://cdn.openttd.org/opengfx-releases/8.0/opengfx-8.0-all.zip -o opengfx-all.zip
        unzip opengfx-all.zip -d opengfx
        mkdir -p "${APP}/Contents/Resources/baseset"
        cp opengfx/*.tar "${APP}/Contents/Resources/baseset/"
        echo "::endgroup::"

        echo "::group::Sign ad-hoc and zip"
        codesign --force --deep --sign - "${APP}"
        codesign --verify --deep --strict "${APP}"
        mkdir app
        ditto -c -k --keepParent "${APP}" app/OpenTTD-cab-view-macos-arm64.zip
        echo "::endgroup::"

    - name: Store app
      uses: actions/upload-artifact@v5
      with:
        name: openttd-cab-view-macos-arm64
        path: build/app
        retention-days: 14
